name: Real Stuttgart rail graph smoke test

on:
  pull_request:
    paths:
      - "tools/osm_pbf_builder.py"
      - "tools/graph_qa.py"
      - "tools/route_smoke.py"
      - "tools/build_stuttgart_graph.sh"
      - "data/regions.json"
      - "requirements-builder.txt"
      - ".github/workflows/rail-graph-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-rail-route:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OSM PBF builder
        run: python -m pip install -r requirements-builder.txt

      - name: Build graph and prove Heilbronn–Stuttgart connectivity
        run: bash tools/build_stuttgart_graph.sh

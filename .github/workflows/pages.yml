name: Deploy RailAtlas Europe to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OSM PBF builder
        run: python -m pip install -r requirements-builder.txt

      - name: Build and validate real Stuttgart rail graph
        shell: bash
        run: |
          set -euo pipefail
          latest_url="https://download.geofabrik.de/europe/germany/baden-wuerttemberg/stuttgart-regbez-latest.osm.pbf"
          pbf="/tmp/stuttgart-regbez.osm.pbf"
          source_url="$(curl --fail --location --silent --show-error --retry 3 --retry-delay 5 --output "$pbf" --write-out '%{url_effective}' "$latest_url")"
          snapshot="$(basename "$source_url" | sed -E 's/.*-([0-9]{6})\.osm\.pbf/\1/')"
          if [[ ! "$snapshot" =~ ^[0-9]{6}$ ]]; then
            echo "Could not pin Geofabrik snapshot URL: $source_url" >&2
            exit 1
          fi
          source_date="20${snapshot:0:2}-${snapshot:2:2}-${snapshot:4:2}"
          echo "Building from OSM snapshot $source_date ($source_url)"
          python tools/osm_pbf_builder.py "$pbf" data/de-bw-stuttgart.graph.json \
            --region de-bw-stuttgart --country DE \
            --source-url "$source_url" --source-date "$source_date"
          python tools/graph_qa.py data/de-bw-stuttgart.graph.json --json /tmp/de-bw-stuttgart-qa.json
          python tools/route_smoke.py data/de-bw-stuttgart.graph.json

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

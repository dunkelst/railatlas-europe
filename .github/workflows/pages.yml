name: Deploy RailAtlas Europe to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'sites/railatlas-europa/**'
      - 'docs/sites-source-manifest.json'
      - 'tools/verify-sites-source.mjs'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      api_origin:
        description: "Öffentliche RailAtlas-Auskunft; optional durch einen eigenen Server ersetzen"
        required: true
        type: string
        default: "https://railatlas-europa.dunkelst.chatgpt.site"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    env:
      RAILATLAS_API_ORIGIN: ${{ inputs.api_origin || vars.RAILATLAS_API_ORIGIN || 'https://railatlas-europa.dunkelst.chatgpt.site' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Verify shared Sites source
        run: node tools/verify-sites-source.mjs

      - name: Verify public timetable API for GitHub Pages
        run: |
          node --input-type=module <<'JS'
          const api = new URL(process.env.RAILATLAS_API_ORIGIN);
          if (api.protocol !== 'https:' || api.username || api.password || api.pathname !== '/' || api.search || api.hash) throw Error('A public HTTPS API origin is required.');
          const origin = 'https://dunkelst.github.io';
          const health = await fetch(new URL('/api/health', api), {headers: {Origin: origin}, signal: AbortSignal.timeout(15000)});
          if (!health.ok || health.headers.get('access-control-allow-origin') !== origin) throw Error('The timetable API is not accessible from GitHub Pages.');
          const data = await health.json();
          if (data.service !== 'RailAtlas Europa' || data.apiVersion !== 1) throw Error('Unexpected timetable API.');
          const preflight = await fetch(new URL('/api/journeys', api), {method: 'OPTIONS', headers: {Origin: origin, 'Access-Control-Request-Method': 'POST', 'Access-Control-Request-Headers': 'content-type'}, signal: AbortSignal.timeout(15000)});
          if (preflight.status !== 204 || preflight.headers.get('access-control-allow-origin') !== origin || !preflight.headers.get('access-control-allow-methods')?.split(',').map(s => s.trim()).includes('POST') || !preflight.headers.get('access-control-allow-headers')?.toLowerCase().split(',').map(s => s.trim()).includes('content-type')) throw Error('Cross-origin journey requests are not enabled.');
          console.log('Public RailAtlas API and journey preflight are available to GitHub Pages.');
          JS

      - name: Install the shared application
        run: npm run install:app

      - name: Build the actual application for Pages
        run: npm run build:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "sites/railatlas-europa/dist-pages"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

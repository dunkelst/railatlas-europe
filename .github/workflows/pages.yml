name: Deploy RailAtlas Europe to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: "Eigener HTTPS-RailAtlas-Auskunftsserver (kein voreingestellter Sites-Server)"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Verify shared Sites source
        run: node tools/verify-sites-source.mjs

      - name: Install the shared application
        run: npm run install:app

      - name: Build the actual application for Pages
        env:
          RAILATLAS_API_ORIGIN: ${{ inputs.api_origin }}
        run: npm run build:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "sites/railatlas-europa/dist-pages"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install builder dependencies
        run: python -m pip install -r requirements-builder.txt
      - name: Run regression suite
        run: npm test
      - name: Run published Sites transport regressions
        run: node --test sites/railatlas-europa/tests/*.test.mjs
